<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Beratungsakte – pferdestaerken.at</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon-32.png">
  <link rel="stylesheet" href="/assets/beratung.css?v=20260622">
</head>
<body>

  <header class="site-header">
    <a href="/" class="site-brand">pferdestärken</a>
    <span class="header-badge">Beratungsakte</span>
  </header>

  <!-- Lock screen -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B8832A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Beratungsakte</h1>
      <p class="lock-sub">
        Dieser Bereich ist geschützt.<br>
        Bitte gib deinen 4-stelligen Zugangscode ein.
      </p>
      <form id="pin-form" autocomplete="off" onsubmit="return false;">
        <div class="pin-inputs">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Stelle 1" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Stelle 2" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Stelle 3" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Stelle 4" autocomplete="off">
        </div>
        <button type="submit" class="btn-unlock" id="btn-unlock">Akte öffnen</button>
        <p class="lock-error" id="lock-error" aria-live="polite"></p>
      </form>
      <div class="lock-contact">
        Zugangscode vergessen?<br>
        <a href="mailto:beratung@pferdestaerken.at">beratung@pferdestaerken.at</a>
      </div>
    </div>
  </div>

  <!-- Report injected here after successful decryption -->
  <div id="report-container"></div>

  <script>
    // Encrypted report payload — produced by encrypt.js
    // Kein Klartextinhalt in dieser Datei.
    const PAYLOAD = __ENCRYPTED_PAYLOAD__;

    const SESSION_KEY = 'ps_unlocked_spesch';

    function b64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(pin, saltBytes) {
      const raw = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltBytes, iterations: 10_000, hash: 'SHA-256' },
        raw,
        { name: 'AES-GCM', length: 256 },
        false, ['decrypt']
      );
    }

    async function tryDecrypt(pin) {
      const salt = b64ToBytes(PAYLOAD.salt);
      const iv   = b64ToBytes(PAYLOAD.iv);
      const ct   = b64ToBytes(PAYLOAD.ct); // ciphertext || 16-byte GCM tag

      try {
        const key = await deriveKey(pin, salt);
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ct
        );
        return new TextDecoder().decode(plainBuf);
      } catch {
        return null; // wrong PIN → decryption fails with DOMException
      }
    }

    async function showReport(html) {
      document.getElementById('lock-screen').style.display = 'none';
      const container = document.getElementById('report-container');

      // Strip base64 images before innerHTML so iOS doesn't have to decode
      // several MB of image data synchronously during the DOM parse.
      const imgData = [];
      const stripped = html.replace(/src="(data:image\/[^"]+)"/g, (_, dataUrl) => {
        const idx = imgData.push(dataUrl) - 1;
        return `src="data:," data-src="${idx}"`;
      });

      container.innerHTML = stripped;
      container.style.display = 'block';
      window.scrollTo(0, 0);

      // Load each image lazily, one frame at a time
      for (const img of container.querySelectorAll('img[data-src]')) {
        await new Promise(r => setTimeout(r, 16));
        img.src = imgData[parseInt(img.dataset.src)];
      }

      setTimeout(initLightbox, 0);
    }

    // Resume from session (stores decrypted HTML so page stays open on reload)
    const cached = sessionStorage.getItem(SESSION_KEY);
    if (cached) showReport(cached);

    // PIN input UX
    const digits = [...document.querySelectorAll('.pin-digit')];
    digits.forEach((el, i) => {
      el.addEventListener('input', () => {
        el.value = el.value.replace(/[^0-9]/g, '').slice(-1);
        if (el.value && i < digits.length - 1) digits[i + 1].focus();
        if (digits.every(d => d.value)) document.getElementById('pin-form').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !el.value && i > 0) digits[i - 1].focus();
        if (e.key === 'ArrowLeft'  && i > 0)             digits[i - 1].focus();
        if (e.key === 'ArrowRight' && i < digits.length - 1) digits[i + 1].focus();
      });
      el.addEventListener('paste', e => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
        pasted.split('').slice(0, 4).forEach((ch, j) => { if (digits[i + j]) digits[i + j].value = ch; });
        const next = Math.min(i + pasted.length, digits.length - 1);
        digits[next].focus();
        if (digits.every(d => d.value)) document.getElementById('pin-form').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
      });
    });

    digits[0].focus();

    document.getElementById('pin-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pin = digits.map(d => d.value).join('');
      if (pin.length < 4) return;

      const btn = document.getElementById('btn-unlock');
      btn.disabled = true;
      btn.textContent = 'Wird entschlüsselt …';

      // Yield so browser paints the button text before heavy crypto work starts
      await new Promise(r => setTimeout(r, 50));

      const html = await tryDecrypt(pin);

      if (html) {
        btn.textContent = 'Akte wird geladen …';
        // Yield again so browser can repaint before the 3MB innerHTML parse
        await new Promise(r => setTimeout(r, 50));
        showReport(html);
        setTimeout(() => { try { sessionStorage.setItem(SESSION_KEY, html); } catch(_) {} }, 300);
      } else {
        btn.disabled = false;
        btn.textContent = 'Akte öffnen';
        const errEl = document.getElementById('lock-error');
        errEl.textContent = 'Ungültiger Code – bitte versuche es erneut.';
        digits.forEach(d => { d.value = ''; d.classList.add('error'); });
        setTimeout(() => digits.forEach(d => d.classList.remove('error')), 400);
        digits[0].focus();
      }
    });

    // Lightbox — initialisiert nach Report-Injection
    function initLightbox() {
      const lb = document.getElementById('lightbox');
      if (!lb) return;
      const lbImg = lb.querySelector('.lightbox-img');
      const lbCounter = lb.querySelector('.lightbox-counter');
      const thumbs = [...document.querySelectorAll('.foto-thumb')];
      let current = 0;

      function open(i) {
        current = i;
        lbImg.src = thumbs[i].querySelector('img').src;
        lbCounter.textContent = `${i + 1} / ${thumbs.length}`;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
      }
      function prev() { open((current - 1 + thumbs.length) % thumbs.length); }
      function next() { open((current + 1) % thumbs.length); }

      thumbs.forEach((t, i) => t.addEventListener('click', () => open(i)));
      lb.querySelector('.lightbox-close').addEventListener('click', close);
      lb.querySelector('.lightbox-prev').addEventListener('click', prev);
      lb.querySelector('.lightbox-next').addEventListener('click', next);
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      });
    }

  </script>

</body>
</html>
