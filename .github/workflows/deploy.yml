name: Deploy to HubSpot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@6.1.0

      - name: Deploy custom.css to HubSpot
        run: |
          cat > hubspot.config.yml <<'HSCFG'
          defaultPortal: pferdestaerken
          portals:
            - name: pferdestaerken
              portalId: ${{ secrets.HUBSPOT_PORTAL_ID }}
              authType: personalaccesskey
              personalAccessKey: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HSCFG
          hs upload custom.css custom.css
          hs filemanager upload blog-custom.css blog-custom.css
